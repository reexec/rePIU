<!doctype html>
<!-- Issue #72: the browser page for rePIU's web build (design 20261016-i072).
     Unit 1: the engine runs in a Worker and draws to this canvas; no sound or
     input yet. Serve this directory over HTTP (python3 -m http.server).
     Decision 9: the ROMs are picked as one folder, or as the ZIP and the CHD
     separately, since the two usually sit in different folders.
     Decision 10: the engine's output sits beside the canvas, with the elapsed
     time and the latest line, so a minute of unpacking does not look stopped. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rePIU (web)</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #111; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 1600px; margin: 0 auto; padding: 16px; box-sizing: border-box;
         display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 440px); gap: 16px; }
  #screen { display: block; width: 100%; aspect-ratio: 4 / 3; background: #000; image-rendering: auto; }
  #side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  #picker { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 12px; align-items: center; }
  #picker input { min-width: 0; }
  #picker .hint { grid-column: 2; color: #888; font-size: 12px; margin-top: -4px; }
  #picker .or { grid-column: 1 / -1; color: #888; }
  #run { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #status { color: #9c9; font-variant-numeric: tabular-nums; }
  #status.problem { color: #e99; }
  #activity { color: #888; font-size: 12px; font-variant-numeric: tabular-nums;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #log-head { display: flex; align-items: center; gap: 8px; color: #888; font-size: 12px; }
  #log-head span { margin-right: auto; }
  #log { flex: 1; min-height: 320px; overflow: auto; background: #000; color: #aaa; padding: 8px; margin: 0;
         font: 12px/1.3 ui-monospace, monospace; white-space: pre-wrap; word-break: break-all; }
  button { padding: 6px 14px; }
  #copy { padding: 2px 10px; }
  @media (max-width: 1100px) {
    main { grid-template-columns: minmax(0, 1fr); }
    #log { min-height: 240px; max-height: 50vh; }
  }
</style>
</head>
<body>
<main>
  <canvas id="screen" width="1280" height="960"></canvas>
  <div id="side">
    <div id="picker">
      <label for="folder">ROM folder</label>
      <input id="folder" type="file" webkitdirectory>
      <span class="hint">The folder holding the game's ZIP and its CHD, for example <code>roms</code>
        with <code>pumpitea.zip</code> and <code>pumpitea/010209_1821.chd</code>. Nothing is uploaded;
        the browser only reads the files.</span>
      <span class="or">or pick the two files separately:</span>
      <label for="zip">ROM ZIP</label>
      <input id="zip" type="file" accept=".zip">
      <label for="chd">CHD</label>
      <input id="chd" type="file" accept=".chd">
    </div>
    <div id="run">
      <label id="game-label" for="game" hidden>Game</label>
      <select id="game" hidden></select>
      <button id="start" disabled>Start</button>
    </div>
    <div id="status">Pick the ROM folder, or the ZIP and the CHD.</div>
    <div id="activity"></div>
    <div id="log-head"><span id="log-count">Engine output</span><button id="copy" disabled>Copy</button></div>
    <pre id="log"></pre>
  </div>
</main>
<script src="rom_selection.js"></script>
<script src="main.js"></script>
</body>
</html>
